[package]
name = "rig-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"
description = "Messaging platform transports and conversation routing for Rig agents."
repository = "https://github.com/0xPlaygrounds/rig"

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false }
bytes.workspace = true
chrono.workspace = true
thiserror.workspace = true

unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
regex.workspace = true

rig-agent = { path = "../rig-agent", version = "0.43.0", default-features = false }
futures.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
fastrand.workspace = true

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false, features = ["test-utils"] }
rig-agent = { path = "../rig-agent", version = "0.43.0", default-features = false, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
serde_json.workspace = true

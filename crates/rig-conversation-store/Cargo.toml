[package]
name = "rig-conversation-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "SQLite conversation history with searchable Qdrant projections."
readme = "README.md"

[lints]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", default-features = false }
qdrant-client.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
tokio-rusqlite = { workspace = true, features = ["bundled"] }
tokio = { workspace = true, features = ["sync", "rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rig-core = { path = "../rig-core", version = "0.43.0", features = ["reqwest"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bytes.workspace = true
rig-reqwest = { path = "../rig-reqwest", version = "0.43.0" }
rig-agent = { path = "../rig-agent", version = "0.43.0" }
anyhow.workspace = true
testcontainers.workspace = true
httpmock.workspace = true
tempfile.workspace = true

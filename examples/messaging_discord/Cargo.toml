[package]
name = "messaging_discord"
version = "0.42.0"
edition = "2024"
publish = false

# Isolate serenity's TLS dependency graph from the Rig workspace, as in discord_bot.
[workspace]

[lints.clippy]
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
rig = { path = "../..", features = ["messaging"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
rig = { path = "../..", features = ["messaging", "test-utils"] }
